    <path d="M40 0C72 90 10 170 40 250S70 420 38 500S8 680 40 750S8 910 40 1000" stroke="#768f63" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M56 300c14-6 24 4 17 12c-4 6-12 2-8-3M30 610c-14-4-20 8-12 13c5 3 10-2 6-6M58 880c12-8 24 0 18 9c-4 5-11 1-7-4" stroke="#7d9669" stroke-width="1" fill="none" stroke-linecap="round"/>

    <use href="#leaf" transform="translate(47 58) rotate(-28) scale(.9)"/>
    <use href="#leafDark" transform="translate(52 82) rotate(22) scale(.85)"/>
    <use href="#leaf" transform="translate(30 190) rotate(15) scale(1.05)"/>
    <use href="#leafDark" transform="translate(28 214) rotate(-35) scale(.8)"/>
    <use href="#leaf" transform="translate(58 330) rotate(-18) scale(1.1)"/>
    <use href="#leafDark" transform="translate(60 356) rotate(32) scale(.9)"/>
    <use href="#leaf" transform="translate(48 404) rotate(-48) scale(.8)"/>
    <use href="#leaf" transform="translate(28 560) rotate(12) scale(1)"/>
    <use href="#leafDark" transform="translate(24 588) rotate(-32) scale(.88)"/>
    <use href="#leaf" transform="translate(22 650) rotate(42) scale(.85)"/>
    <use href="#leaf" transform="translate(50 822) rotate(-24) scale(1.05)"/>
    <use href="#leafDark" transform="translate(48 846) rotate(26) scale(.9)"/>
    <use href="#leaf" transform="translate(30 932) rotate(-40) scale(.8)"/>

    <use href="#bud" transform="translate(72 272) rotate(28)"/>
    <use href="#bud" transform="translate(48 664) rotate(36) scale(.9)"/>
    <use href="#bud" transform="translate(66 948) rotate(22) scale(.85)"/>

    <use href="#berries" transform="translate(84 176)"/>
    <use href="#berries" transform="translate(72 528) rotate(40)"/>
    <use href="#berries" transform="translate(86 786) rotate(-20)"/>

    <use href="#leaf" transform="translate(42 150) rotate(-62) scale(.75)"/>
    <use href="#rose" transform="translate(42 132) scale(1.3)"/>
    <use href="#leafDark" transform="translate(34 470) rotate(58) scale(.8)"/>
    <use href="#rose" transform="translate(32 464) rotate(20) scale(1.1)"/>
    <use href="#leaf" transform="translate(52 742) rotate(-70) scale(.8)"/>
    <use href="#rose" transform="translate(46 724) rotate(-14) scale(1.4)"/>
