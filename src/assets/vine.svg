      <path d="M2 0C14-1 26-1 38 0" stroke="#3e5535" stroke-width=".7" fill="none" opacity=".5"/>
    </g>
    <path id="petal" d="M0-4C-14-6-22-18-14-27C-7-33 7-33 14-27C22-18 14-6 0-4Z"/>
    <g id="rose">
      <g fill="url(#p1)" stroke="#c07b7c" stroke-width=".5" stroke-opacity=".45">
        <use href="#petal"/>
        <use href="#petal" transform="rotate(72)"/>
        <use href="#petal" transform="rotate(144)"/>
        <use href="#petal" transform="rotate(216)"/>
        <use href="#petal" transform="rotate(288)"/>
      </g>
      <g fill="url(#p2)" transform="rotate(36) scale(.66)">
        <use href="#petal"/>
        <use href="#petal" transform="rotate(72)"/>
        <use href="#petal" transform="rotate(144)"/>
        <use href="#petal" transform="rotate(216)"/>
        <use href="#petal" transform="rotate(288)"/>
      </g>
      <g fill="url(#p3)" transform="rotate(10) scale(.38)">
        <use href="#petal"/>
        <use href="#petal" transform="rotate(72)"/>
        <use href="#petal" transform="rotate(144)"/>
        <use href="#petal" transform="rotate(216)"/>
        <use href="#petal" transform="rotate(288)"/>
      </g>
      <circle r="5.5" fill="#a9555c"/>
      <path d="M-2.5 1C-3.5-3 2.5-5 3.5-1C4.5 2.5-1 4.5-2 2C-2.8-.5.8-1.6 1 0" stroke="#7a3540" stroke-width="1" fill="none" stroke-linecap="round"/>
      <path d="M-11-17C-6-21 2-22 7-20M-17 6C-19 0-18-6-15-10" stroke="#fff" stroke-width="1.1" fill="none" opacity=".45" stroke-linecap="round"/>
    </g>
    <g id="bud">
      <path d="M0 0C-6-6-6-16 0-23C6-16 6-6 0 0Z" fill="url(#p2)"/>
      <path d="M0 0C-5-4-7-11-5-15C-2-10 0-6 0 0ZM0 0C5-4 7-11 5-15C2-10 0-6 0 0Z" fill="#7d9969"/>
      <path d="M0 0V9" stroke="#6f8a5f" stroke-width="1.4"/>
    </g>
    <g id="berries">
      <path d="M0 0L5-4M0 0L-4-6M0 0L1 7" stroke="#8f7a3e" stroke-width=".6"/>
      <circle cx="5" cy="-4" r="2.1" fill="#c9a24a"/>
      <circle cx="-4" cy="-6" r="1.8" fill="#d6b462"/>
      <circle cx="1" cy="7" r="1.6" fill="#b8913c"/>
      <circle cx="0" cy="0" r="1.3" fill="#c9a24a"/>
    </g>
