<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 1000">
  <defs>
    <radialGradient id="p1" cx=".45" cy=".35" r=".8">
      <stop offset="0" stop-color="#fdece8"/>
      <stop offset=".55" stop-color="#efc1ba"/>
      <stop offset="1" stop-color="#cf8b89"/>
    </radialGradient>
    <radialGradient id="p2" cx=".5" cy=".4" r=".75">
      <stop offset="0" stop-color="#f6cbc4"/>
      <stop offset="1" stop-color="#b8646b"/>
    </radialGradient>
    <radialGradient id="p3" cx=".5" cy=".45" r=".7">
      <stop offset="0" stop-color="#e9a39f"/>
      <stop offset="1" stop-color="#9c4b54"/>
    </radialGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#647f55"/>
      <stop offset=".6" stop-color="#97b083"/>
      <stop offset="1" stop-color="#bccca6"/>
    </linearGradient>
    <linearGradient id="lg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f6943"/>
      <stop offset="1" stop-color="#8aa477"/>
    </linearGradient>
    <filter id="paint" x="-10%" y="-5%" width="120%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/>
    </filter>

    <g id="leaf">
